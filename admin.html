<style>
  /* d43 (01/out/2026): overflow-x — com 13 abas a barra passava da largura do celular e a PÁGINA rolava de lado;
     agora quem rola é a barra. No computador nada muda: as abas continuam encolhendo como antes. */
  .adm-tabs { display:none; max-width:1080px; margin:0 auto; padding:20px 24px 0; gap:0; overflow-x:auto; }
  .adm-tab { padding:8px 18px; background:var(--bg); color:var(--text-2); border:1.5px solid var(--border); border-bottom:none; border-radius:8px 8px 0 0; cursor:pointer; font-size:13px; font-weight:500; transition:background .15s,color .15s; }
  .adm-tab.active { background:var(--surface,#fff); color:var(--blue); border-color:var(--blue); position:relative; z-index:1; }
  [data-theme="dark"] .adm-tab.active { background:var(--bg-2,#1e1e1e); }
  .adm-tab:hover:not(.active) { background:var(--bg-2,#eee); }
  .adm-body { max-width:1080px; margin:0 auto; padding:0 24px 60px; border-top:1.5px solid var(--border); padding-top:24px; }
  .adm-body--embed { max-width:none; padding:0 !important; border-top:none !important; }
  /* d70 (25/out/2026, pedido do fundador com o print da barra rolável): a partir de 1024 px as abas viram uma COLUNA fixa
     à esquerda (presa abaixo do cabeçalho, com rolagem própria quando não cabem na altura) e o conteúdo fica à direita.
     Na d70 a largura total subia de 1080 para 1340 px (coluna de 220 px, espaço de 20 px, conteúdo de 1052 px); desde
     a d72 o espaço é 0, a coluna encosta na esquerda e o conteúdo tem até 1400 px (o parágrafo da d72, abaixo, é o que
     vale). Abaixo de 1024 px nada muda: a barra rolável acima (a que serve ao celular). A guarda
     display:none da .adm-tabs fica — só o cbInit, depois de confirmar o admin, a mostra. Só variáveis do tema.
     A grade só vale com a classe .adm-com-nav, que o cbInit põe no MESMO passo em que mostra as abas: sem ela (carga,
     sessão ou perfil não confirmados, conta comum) o #admin seria o único item da grade e cairia na trilha de 220 px —
     o card « Acesso restrito » espremido à esquerda (revisão do rito, 25/out/2026). Entre 1024 e 1316 px o conteúdo é
     mais estreito que os 1032 px de antes da d70 (a coluna ocupa 220 px e o conteúdo tem 32 px de margem de cada lado):
     é o preço de a coluna valer a partir de 1024 px.
     d72 (26/out/2026, pedido do fundador com o print de um painel de exemplo): a coluna vira a BARRA AZUL encostada à
     esquerda, na altura toda abaixo do cabeçalho (sticky, rolagem própria), com a aba ativa numa pílula clara; o conteúdo
     fica num fundo cinza-claro, à direita, com até 1400 px (1336 px úteis, mais que os 1032 de antes da d70). As cores são
     os tokens --d72-* abaixo, com o par do tema escuro, e o contraste de cada texto é MEDIDO pelo
     tests/admin-dashboard.check.mjs. --d72-cab é a altura do cabeçalho (.nav do css/style.css: 12 px + 42,4 px do botão
     + 12 px + 1 px de borda), para a barra começar logo abaixo dele. */
  :root { --d72-nav:var(--blue); --d72-nav-txt:#FFFFFF; --d72-nav-txt2:#E4EEF9; --d72-nav-hover:#2B6CB0; --d72-nav-ativo:#FFFFFF;
    --d72-nav-ativo-txt:var(--blue-dark); --d72-fundo:#EEF1F5; --d72-borda:#E3E7ED; --d72-chip:#EEF1F5; --d72-chip-txt:#4B5260;
    --d72-boas:var(--blue-light); --d72-boas-txt:var(--blue-dark); --d72-sombra:0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.07);
    --d72-cab:68px; }
  [data-theme="dark"] { --d72-nav:#0F2A46; --d72-nav-txt:#FFFFFF; --d72-nav-txt2:#C7D6E6; --d72-nav-hover:#1B4170; --d72-nav-ativo:#5AA2EA;
    --d72-nav-ativo-txt:#0B1E33; --d72-fundo:#0F1013; --d72-borda:#2C2F36; --d72-chip:#2A2E35; --d72-chip-txt:#C2C5CB;
    --d72-boas:var(--blue-light); --d72-boas-txt:var(--blue-dark); --d72-sombra:0 1px 2px rgba(0,0,0,.40), 0 6px 18px rgba(0,0,0,.35);
    --d72-cab:68px; }
  @media (min-width:1024px) {
    .adm-layout.adm-com-nav { display:grid; grid-template-columns:220px minmax(0, 1fr); gap:0; max-width:none; margin:0; padding:0; align-items:start;
      min-height:calc(100vh - var(--d72-cab)); background:var(--d72-fundo); }
    .adm-layout.adm-com-nav > .adm-tabs { max-width:none; margin:0; padding:18px 12px; flex-direction:column; gap:4px; overflow-x:visible; overflow-y:auto;
      position:sticky; top:var(--d72-cab); height:calc(100vh - var(--d72-cab)); max-height:calc(100vh - var(--d72-cab)); background:var(--d72-nav); border:none; border-radius:0; }
    .adm-layout.adm-com-nav > .adm-tabs > .adm-tab { display:flex; align-items:center; gap:10px; width:100%; flex-shrink:0; text-align:left; padding:10px 14px; border:none; border-radius:999px;
      background:transparent; color:var(--d72-nav-txt2); font-size:13.5px; }
    .adm-layout.adm-com-nav > .adm-tabs > .adm-tab > .ti { font-size:18px; width:20px; text-align:center; flex-shrink:0; }
    .adm-layout.adm-com-nav > .adm-tabs > .adm-tab.active { background:var(--d72-nav-ativo); color:var(--d72-nav-ativo-txt); font-weight:600; box-shadow:var(--d72-sombra); }
    .adm-layout.adm-com-nav > .adm-tabs > .adm-tab:hover:not(.active) { background:var(--d72-nav-hover); color:var(--d72-nav-txt); }
    .adm-layout.adm-com-nav > .adm-tabs > .adm-tab:focus-visible { outline:2px solid var(--d72-nav-txt); outline-offset:2px; }
    .adm-layout.adm-com-nav > .adm-body { max-width:1400px; width:100%; margin:0 auto; padding:28px 32px 60px; border-top:none; min-width:0; }
  }
  /* d71 (25/out/2026): a aba Dashboard (bloco d71 do js/admin.js). O « Personalizar » é uma lista simples (caixa, setas e
     largura): nada de arrastar. Só variáveis do tema.
     d72 (26/out/2026): o MOSAICO. Cada cartão é um tile branco (--surface) de raio 14 px e sombra suave, com a bolha do
     ícone em tom pastel da aba de origem, o rótulo pequeno em caixa alta, o número grande, a linha secundária e a origem
     num chip dentro dele. A grade: 1 coluna no celular, 2 a partir de 700 px, 3 a partir de 1024 e 4 a partir de 1340; o
     cartão de largura 2 (as tabelas, o funil e os gráficos do d67) ocupa duas colunas a partir de 700 px. O conteúdo dos
     cartões é o mesmo de antes: só a casca mudou. Contraste medido pelo check; sem cor fora dos tokens. */
  .d71-topo { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .d71-acoes { display:flex; gap:8px; flex-wrap:wrap; }
  #d71-raiz .page-sub { color:var(--text-2); }
  #d71-raiz .btn { border-radius:999px; }
  #d71-raiz .btn.sm { min-width:34px; justify-content:center; }
  #d71-raiz select.sinapi-uf { border-radius:999px; }
  .d71-aviso { margin:0 0 12px; font-size:12.5px; color:var(--amber); }
  .d71-frase { margin:0 0 12px; font-size:12.5px; }
  .d71-frase-ok { color:var(--green); } .d71-frase-erro { color:var(--red); }
  .d71-grade { display:grid; grid-template-columns:1fr; gap:16px; align-items:start; }
  /* d72: regra de autor com `display` VENCE o [hidden] da folha do navegador (a lição do css/style.css, .ia-acao[hidden]):
     sem esta linha, o « Personalizar » escondia a grade pelo atributo e ela continuava à vista, com o editor embaixo. */
  .d71-grade[hidden] { display:none; }
  .d71-cel { min-width:0; overflow-wrap:anywhere; }
  .d71-painel { padding:12px; }
  .d71-painel-h { margin:0 0 8px; font-size:14px; }
  .d71-falha { font-size:11.5px; color:var(--amber); margin-top:4px; }
  .d72-tile { background:var(--surface); border:1px solid var(--d72-borda); border-radius:14px; box-shadow:var(--d72-sombra); padding:16px 18px; margin:0; }
  .d72-compacto { display:grid; grid-template-columns:40px minmax(0, 1fr); grid-template-areas:"bolha corpo" "bolha chip"; column-gap:12px; align-content:start; }
  .d72-painel { display:grid; grid-template-columns:40px minmax(0, 1fr); grid-template-areas:"bolha chip" "corpo corpo"; column-gap:12px; row-gap:10px; align-content:start; }
  .d72-bolha { grid-area:bolha; display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; font-size:20px; flex-shrink:0; }
  .d72-bolha-sm { width:26px; height:26px; font-size:14px; }
  .d72-bolha-azul { background:var(--blue-light); color:var(--blue); }
  .d72-bolha-verde { background:var(--green-light); color:var(--green); }
  .d72-bolha-roxo { background:var(--purple-light); color:var(--purple); }
  .d72-bolha-coral { background:var(--coral-light); color:var(--coral); }
  .d72-bolha-teal { background:var(--teal-light); color:var(--teal); }
  .d72-bolha-ambar { background:var(--amber-light); color:var(--amber); }
  .d72-bolha-faixa { background:var(--surface); color:var(--blue); }
  .d72-corpo { grid-area:corpo; min-width:0; }
  .d72-corpo > .card { background:transparent; border:none; box-shadow:none; padding:0; margin:0; border-radius:0; }
  .d72-tile .d62-rotulo, .d72-tile .d67-rotulo, .d72-tile .d71-painel-h { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2); margin:0; }
  /* o número só quebra nos espaços (« R$ » e « 1.480,00 »): o overflow-wrap:anywhere da célula o partia no meio */
  .d72-tile .d62-valor, .d72-tile .d67-valor { font-size:24px; font-weight:700; margin:2px 0 4px; letter-spacing:-.01em; overflow-wrap:normal; }
  .d72-tile .d62-base, .d72-tile .d62-nota { font-size:12px; color:var(--text-2); }
  .d72-chip { grid-area:chip; justify-self:start; align-self:center; margin-top:10px; padding:2px 10px; border-radius:999px; font-size:11px; font-weight:600;
    background:var(--d72-chip); color:var(--d72-chip-txt); }
  .d72-painel > .d72-chip { margin-top:0; }
  .d72-boas { display:flex; align-items:center; gap:14px; padding:16px 20px; margin:0 0 16px; border-radius:14px; background:var(--d72-boas); border:1px solid var(--d72-borda); }
  .d72-boas-ola { margin:0; font-size:19px; font-weight:600; line-height:1.3; color:var(--d72-boas-txt); }
  .d72-boas-data { margin:2px 0 0; font-size:13px; color:var(--text-2); }
  .d72-ed-grade { display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:12px; }
  .d71-ed { background:var(--surface); border:1px solid var(--d72-borda); border-radius:14px; box-shadow:var(--d72-sombra); padding:16px 18px; margin:0; }
  .d71-ed-h { margin:0 0 8px; font-size:14px; }
  .d71-ed-linha { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:7px 0; border-top:1px solid var(--border); font-size:13px; }
  .d71-ed-linha label { display:flex; align-items:center; gap:8px; min-width:0; flex:1 1 220px; }
  .d71-ed-grupo { margin:12px 0 2px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-2); font-weight:700; }
  @media (min-width:700px) { .d71-grade { grid-template-columns:repeat(2, minmax(0, 1fr)); } .d71-l2 { grid-column:span 2; } }
  @media (min-width:1024px) { .d71-grade { grid-template-columns:repeat(3, minmax(0, 1fr)); } .d72-ed-grade { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  @media (min-width:1340px) { .d71-grade { grid-template-columns:repeat(4, minmax(0, 1fr)); } }
  /* d62 (11/out/2026): o PAINEL EXECUTIVO no topo das abas Métricas e Financeiro (bloco d62 do js/admin.js). Os cartões
     se ajeitam sozinhos pela largura e, até 520 px, ficam um por linha; o texto longo quebra em vez de alargar a página.
     Só variáveis de cor do tema (claro e escuro). Aqui, e não no css/style.css, que é medido na abertura do app. */
  .d62 { margin-bottom:18px; }
  .d62-titulo { margin:0 0 2px; font-size:16px; }
  .d62-sub { margin:0 0 10px; font-size:12px; }
  .d62-grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; }
  .d62-card { padding:12px; min-width:0; overflow-wrap:anywhere; }
  .d62-rotulo { font-size:12.5px; color:var(--text-2); }
  .d62-valor { font-size:22px; font-weight:700; margin:4px 0 2px; line-height:1.2; }
  .d62-base { font-size:11.5px; color:var(--text-2); }
  .d62-nota { font-size:11.5px; color:var(--text-3); margin-top:4px; }
  @media (max-width:520px) { .d62-grade { grid-template-columns:1fr; } }
  /* d67 (12/out/2026): KPIs e metas logo abaixo do painel executivo (bloco d67 do js/admin.js; motor no js/kpis.js). Um
     card por KPI com o gráfico em SVG que encolhe com a largura; até 520 px, um por linha. Só variáveis do tema. */
  .d67 { margin-bottom:18px; }
  .d67-titulo { margin:0 0 2px; font-size:16px; }
  .d67-sub { margin:0 0 10px; font-size:12px; }
  .d67-aviso { margin:0 0 10px; font-size:12.5px; color:var(--amber); }
  .d67-grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:10px; }
  .d67-card { padding:12px; min-width:0; overflow-wrap:anywhere; }
  .d67-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .d67-rotulo { font-size:12.5px; color:var(--text-2); }
  .d67-ajuda summary { cursor:pointer; font-weight:700; color:var(--blue); min-width:24px; text-align:center; list-style:none; }
  .d67-ajuda p { font-size:11.5px; color:var(--text-2); margin:6px 0 0; }
  .d67-valor { font-size:22px; font-weight:700; margin:4px 0 2px; line-height:1.2; }
  .d67-base, .d67-meta { font-size:11.5px; color:var(--text-2); }
  .d67-graf { display:block; width:100%; height:auto; margin-top:6px; }
  .d67-legenda { font-size:11px; color:var(--text-3); margin-top:2px; }
  .d67-metas { margin-top:12px; padding:12px; }
  .d67-form { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px; margin-bottom:8px; }
  .d67-form label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--text-2); min-width:0; }
  .d67-ref { font-size:11.5px; margin:4px 0; }
  .d67-frase { font-size:12.5px; margin:8px 0 0; }
  .d67-frase-ok { color:var(--green); }
  .d67-frase-erro { color:var(--red); }
  .d67-hist { margin-top:10px; font-size:12px; }
  /* d67 fatia 2 (17/out/2026): « Ampliar » ao lado do « ? »; o card ampliado ocupa a linha inteira da grade, com o gráfico
     grande, as seções « O que este indicador mede » e « De onde vêm os dados » (duas colunas a partir de 720 px) e a tabela
     dos 12 meses. No celular a grade já é de uma coluna: o card só fica mais alto. O invólucro .d67-acoes ENCOLHE
     (min-width:0), como o « ? » encolhia antes dele: aberto, o « ? » quebra a fórmula dentro do card em vez de alargá-lo
     para fora; só o botão não encolhe (com o overflow-wrap:anywhere do card, ele quebraria letra a letra). */
  .d67-acoes { display:flex; align-items:flex-start; gap:6px; min-width:0; }
  .d67-acoes > .btn { flex-shrink:0; }
  .d67-card-ampliado { grid-column:1 / -1; }
  .d67-graf-ampliado { margin-top:10px; }
  .d67-amp { display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px; }
  .d67-amp-sec p { font-size:12px; color:var(--text-2); margin:4px 0 0; }
  .d67-amp-tit { margin:0; font-size:13px; }
  .d67-amp-tab { overflow-x:auto; }
  .d67-meses { font-size:12px; }
  .d67-meses caption { text-align:left; font-size:11.5px; color:var(--text-3); padding-bottom:4px; }
  .d67-diminuir-fim { margin-top:10px; }
  @media (min-width:720px) { .d67-amp { grid-template-columns:1fr 1fr; } .d67-amp-tab { grid-column:1 / -1; } }
  @media (max-width:520px) { .d67-grade { grid-template-columns:1fr; } .d67-form { grid-template-columns:1fr; } }
  /* e33 (17/out/2026): a calculadora de Viabilidade dentro do Admin (bloco e33 do js/admin.js; motor no
     js/viabilidade-motor.js). Premissas à esquerda e resultados à direita; até 820 px, uma coluna. Tabelas largas rolam

  .e33-ok { color:var(--green); } .e33-erro { color:var(--red); }

  .e33-grade { display:grid; grid-template-columns:290px minmax(0, 1fr); gap:12px; align-items:start; }

  .e33-kpis { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px; margin-bottom:12px; }
  .e33-kpi { overflow-wrap:anywhere; }

<script>
  // Gate: exige backend + sessão + role=admin.
  window.cbInit = function () {
    const el = document.getElementById("admin");
    if (!(window.CB_CONFIG && window.CB_CONFIG.SUPA_READY)) {
      el.innerHTML = `<div class="card"><p>O painel admin exige o backend (Supabase) configurado.</p></div>`;
      return;
    }
    // a41 (17/set/2026): com o boot otimista pode haver sessão PENDENTE (sem cache de perfil + SDK lento).
    // Não é "deslogado": espera o SDK responder em vez de mandar ao login quem está logado.
    var _pend = !AUTH.session() && AUTH.sessaoPendente && AUTH.sessaoPendente();
    if (_pend) { _pend.then(window.cbInit); return; }
    if (!AUTH.session()) {
      // a47 (19/set/2026): só vai ao login quem o SDK já disse que não tem sessão E não tem nada guardado. Sessão
      // guardada que o SDK não confirmou: diz isso e dá as saídas; se a sessão chegar, o painel abre sozinho.
      if (typeof AUTH.podeIrAoLogin === "function" && !AUTH.podeIrAoLogin()) {
        el.innerHTML = `<div class="card" role="alert" style="max-width:520px;margin:40px auto;text-align:center;padding:28px">
          <p style="color:var(--text-2);margin-bottom:14px">Não consegui confirmar sua sessão. Pode ser a conexão ou o servidor de login.</p>
          <p><button class="btn primary" onclick="location.reload()"><i class="ti ti-refresh"></i>Tentar de novo</button>
          <a class="btn" href="index.html#entrar"><i class="ti ti-login"></i>Entrar de novo</a></p>
        </div>`;
        if (!window._cbAdmOuvindo && typeof AUTH.aoMudarSessao === "function") {
          window._cbAdmOuvindo = true;
          AUTH.aoMudarSessao(function (s) { if (s) window.cbInit(); });
        }
        return;
      }
      window.location.href = "index.html#entrar"; return;
    }
    // a47: perfil PROVISÓRIO (1º acesso no aparelho, perfil ainda no ar: role "user" por padrão) não decide "não é
    // admin" — espera a carga em curso. Depois dela decide com o que houver; a re-tentativa, se o perfil chegar mais
    // tarde, redesenha por cbPerfilMudou (abaixo). Uma espera só, e quem redesenha é ela: a mesma carga, quando muda o
    // role, também dispara cbPerfilMudou — antes o painel saía duas vezes (10 consultas às métricas em vez de 5).
    var _perf = AUTH.perfilPendente && AUTH.perfilPendente();
    if (_perf) {
      if (!window._cbAdmEsperaPerfil) {
        window._cbAdmEsperaPerfil = true;
        _perf.then(function () { window._cbAdmEsperaPerfil = false; window.cbInit(); });
      }
      return;
    }
    // a47 (céticos, 19/set/2026): a carga terminou SEM ler o perfil (falhou ou estourou o prazo; a re-tentativa vem em
    // 3 s, 10 s e 30 s) e ele segue PROVISÓRIO. "Acesso restrito (role: user)" aqui seria decidir com o padrão, não com
    // o perfil. Diz que está lendo e espera a 1ª leitura boa (AUTH.depoisDoPerfil), uma vez; quem redesenha é ela.
    if (AUTH.perfilProvisorio && AUTH.perfilProvisorio()) {
      el.innerHTML = `<div class="card" role="status" style="max-width:520px;margin:40px auto;text-align:center;padding:28px">
        <p style="color:var(--text-2);margin-bottom:14px">Ainda não consegui ler o seu perfil. Tentando de novo…</p>
        <p><button class="btn primary" onclick="location.reload()"><i class="ti ti-refresh"></i>Tentar de novo</button></p>
      </div>`;
      if (!window._cbAdmEsperaPerfil && typeof AUTH.depoisDoPerfil === "function") {
        window._cbAdmEsperaPerfil = true;
        AUTH.depoisDoPerfil(function () { window._cbAdmEsperaPerfil = false; window.cbInit(); });
      }
      return;
    }
    if (!AUTH.isAdmin()) {
      el.innerHTML = `<div class="card" style="max-width:520px;margin:40px auto;text-align:center;padding:36px">
        <div class="card-icon" style="background:var(--red-light);color:var(--red);margin:0 auto 14px"><i class="ti ti-lock"></i></div>
        <h2 style="font-size:19px;font-weight:600;margin-bottom:6px">Acesso restrito</h2>
        <p style="color:var(--text-2)">Esta área é só para administradores. Sua conta é <strong>${AUTH.session().email}</strong> (role: ${AUTH.session().role}).</p>
        <p style="margin-top:14px"><a class="btn" href="app.html"><i class="ti ti-arrow-left"></i>Voltar ao app</a></p>
      </div>`;
      return;
    }
    document.querySelector(".adm-layout").classList.add("adm-com-nav");   // d70: a grade da coluna só com as abas à vista
    document.getElementById("admin-nav").style.display = "flex";
    showAdminView("dashboard");   // d71: o painel abre no Dashboard (decisão da integradora, 25/out/2026)
  };
  // a41: se a revalidação do perfil mudar o role (ex.: 1º acesso no aparelho, perfil chegou depois), redesenha.
  // O painel continua protegido no servidor (RLS/RPC); isto é só a tela acompanhando o perfil confirmado.
  // a47: com o cbInit esperando o perfil (_cbAdmEsperaPerfil), quem redesenha é a espera — uma vez só.
  window.cbPerfilMudou = function () { if (window._cbAdmEsperaPerfil) return; if (typeof window.cbInit === "function") window.cbInit(); };
</script>

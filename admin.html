<style>
  /* d43 (01/out/2026): overflow-x — com 13 abas a barra passava da largura do celular e a PÁGINA rolava de lado;
     agora quem rola é a barra. No computador nada muda: as abas continuam encolhendo como antes. */
  .adm-tabs { display:none; max-width:1080px; margin:0 auto; padding:20px 24px 0; gap:0; overflow-x:auto; }
  .adm-tab { padding:8px 18px; background:var(--bg); color:var(--text-2); border:1.5px solid var(--border); border-bottom:none; border-radius:8px 8px 0 0; cursor:pointer; font-size:13px; font-weight:500; transition:background .15s,color .15s; }
  .adm-tab.active { background:var(--surface,#fff); color:var(--blue); border-color:var(--blue); position:relative; z-index:1; }
  [data-theme="dark"] .adm-tab.active { background:var(--bg-2,#1e1e1e); }
  .adm-tab:hover:not(.active) { background:var(--bg-2,#eee); }
  .adm-body { max-width:1080px; margin:0 auto; padding:0 24px 60px; border-top:1.5px solid var(--border); padding-top:24px; }
  .adm-body--embed { max-width:none; padding:0 !important; border-top:none !important; }
  /* d62 (11/out/2026): o PAINEL EXECUTIVO no topo das abas Métricas e Financeiro (bloco d62 do js/admin.js). Os cartões
     se ajeitam sozinhos pela largura e, até 520 px, ficam um por linha; o texto longo quebra em vez de alargar a página.
     Só variáveis de cor do tema (claro e escuro). Aqui, e não no css/style.css, que é medido na abertura do app. */
  .d62 { margin-bottom:18px; }
  .d62-titulo { margin:0 0 2px; font-size:16px; }
  .d62-sub { margin:0 0 10px; font-size:12px; }
  .d62-grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:10px; }
  .d62-card { padding:12px; min-width:0; overflow-wrap:anywhere; }
  .d62-rotulo { font-size:12.5px; color:var(--text-2); }
  .d62-valor { font-size:22px; font-weight:700; margin:4px 0 2px; line-height:1.2; }
  .d62-base { font-size:11.5px; color:var(--text-2); }
  .d62-nota { font-size:11.5px; color:var(--text-3); margin-top:4px; }
  @media (max-width:520px) { .d62-grade { grid-template-columns:1fr; } }
  /* d67 (12/out/2026): KPIs e metas logo abaixo do painel executivo (bloco d67 do js/admin.js; motor no js/kpis.js). Um
     card por KPI com o gráfico em SVG que encolhe com a largura; até 520 px, um por linha. Só variáveis do tema. */
  .d67 { margin-bottom:18px; }
  .d67-titulo { margin:0 0 2px; font-size:16px; }
  .d67-sub { margin:0 0 10px; font-size:12px; }
  .d67-aviso { margin:0 0 10px; font-size:12.5px; color:var(--amber); }
  .d67-grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:10px; }
  .d67-card { padding:12px; min-width:0; overflow-wrap:anywhere; }
  .d67-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .d67-rotulo { font-size:12.5px; color:var(--text-2); }
  .d67-ajuda summary { cursor:pointer; font-weight:700; color:var(--blue); min-width:24px; text-align:center; list-style:none; }
  .d67-ajuda p { font-size:11.5px; color:var(--text-2); margin:6px 0 0; }
  .d67-valor { font-size:22px; font-weight:700; margin:4px 0 2px; line-height:1.2; }
  .d67-base, .d67-meta { font-size:11.5px; color:var(--text-2); }
  .d67-graf { display:block; width:100%; height:auto; margin-top:6px; }
  .d67-legenda { font-size:11px; color:var(--text-3); margin-top:2px; }
  .d67-metas { margin-top:12px; padding:12px; }
  .d67-form { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:8px; margin-bottom:8px; }
  .d67-form label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--text-2); min-width:0; }

  .d67-frase-ok { color:var(--green); }
  .d67-frase-erro { color:var(--red); }
  .d67-hist { margin-top:10px; font-size:12px; }
  /* d67 fatia 2 (17/out/2026): « Ampliar » ao lado do « ? »; o card ampliado ocupa a linha inteira da grade, com o gráfico
     grande, as seções « O que este indicador mede » e « De onde vêm os dados » (duas colunas a partir de 720 px) e a tabela
     dos 12 meses. No celular a grade já é de uma coluna: o card só fica mais alto. O invólucro .d67-acoes ENCOLHE
     (min-width:0), como o « ? » encolhia antes dele: aberto, o « ? » quebra a fórmula dentro do card em vez de alargá-lo
     para fora; só o botão não encolhe (com o overflow-wrap:anywhere do card, ele quebraria letra a letra). */

  .d67-acoes > .btn { flex-shrink:0; }
  .d67-card-ampliado { grid-column:1 / -1; }

  .d67-amp { display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px; }
  .d67-amp-sec p { font-size:12px; color:var(--text-2); margin:4px 0 0; }
  .d67-amp-tit { margin:0; font-size:13px; }
  .d67-amp-tab { overflow-x:auto; }
  .d67-meses { font-size:12px; }

  .d67-diminuir-fim { margin-top:10px; }
  @media (min-width:720px) { .d67-amp { grid-template-columns:1fr 1fr; } .d67-amp-tab { grid-column:1 / -1; } }
  @media (max-width:520px) { .d67-grade { grid-template-columns:1fr; } .d67-form { grid-template-columns:1fr; } }
  /* e33 (17/out/2026): a calculadora de Viabilidade dentro do Admin (bloco e33 do js/admin.js; motor no
     js/viabilidade-motor.js). Premissas à esquerda e resultados à direita; até 820 px, uma coluna. Tabelas largas rolam

  .e33-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .e33-barra { display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px; padding:12px; margin-bottom:12px; }
  .e33-estado { font-size:12.5px; min-width:0; overflow-wrap:anywhere; }
  .e33-ok { color:var(--green); } .e33-erro { color:var(--red); }
  .e33-aviso { margin:0 0 12px; font-size:13px; color:var(--amber); }
  .e33-grade { display:grid; grid-template-columns:290px minmax(0, 1fr); gap:12px; align-items:start; }
  .e33-campos { padding:10px 12px; }
  .e33-grupo { border-bottom:1px solid var(--border); padding:6px 0; }

  .e33-rotulo { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--text-2); margin:8px 0; min-width:0; }
  .e33-unid { color:var(--text-3); }
  .e33-check { display:flex; align-items:center; gap:6px; font-size:12.5px; margin:8px 0; }
  .e33-principal { min-width:0; }
  .e33-abas { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .e33-principal .card { padding:12px; margin-bottom:12px; min-width:0; }
  .e33-nota { display:flex; gap:12px; align-items:center; }
  .e33-letra { font-size:26px; font-weight:800; width:46px; height:46px; display:flex; align-items:center; justify-content:center; border-radius:10px; border:2px solid var(--border); flex:none; }
  .e33-letra-A { color:var(--green); border-color:var(--green); } .e33-letra-B { color:var(--blue); border-color:var(--blue); }
  .e33-letra-C { color:var(--amber); border-color:var(--amber); } .e33-letra-D { color:var(--red); border-color:var(--red); }
  .e33-kpis { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px; margin-bottom:12px; }
  .e33-kpi { overflow-wrap:anywhere; }
  .e33-kpi-rot { font-size:12px; color:var(--text-2); }
  .e33-kpi-val { font-size:20px; font-weight:700; margin:4px 0 2px; }
  .e33-kpi-sub { font-size:11.5px; color:var(--text-3); }
  .e33-ruim .e33-kpi-val { color:var(--red); }
  .e33-duas { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; }
  .e33-h { margin:0 0 8px; font-size:14px; }
  .e33-num { text-align:right; white-space:nowrap; }
  .e33-rola { overflow-x:auto; }
  .e33-dre td:first-child { white-space:nowrap; }
  .e33-graf { display:block; width:100%; height:auto; }
  .e33-legenda { font-size:11.5px; color:var(--text-3); margin:6px 0 0; }
  .e33-lista { margin:0; padding-left:18px; font-size:13px; } .e33-lista li { margin-bottom:8px; }
  .e33-melhor { color:var(--green); font-weight:700; } .e33-pior { color:var(--red); } .e33-meio { color:var(--amber); }
  .e33-confirma { display:inline-flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12.5px; }
  .e33-novo { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin-top:10px; }
  @media (max-width:820px) { .e33-grade { grid-template-columns:1fr; } }

<script>
  // Gate: exige backend + sessão + role=admin.
  window.cbInit = function () {
    const el = document.getElementById("admin");
    if (!(window.CB_CONFIG && window.CB_CONFIG.SUPA_READY)) {
      el.innerHTML = `<div class="card"><p>O painel admin exige o backend (Supabase) configurado.</p></div>`;
      return;
    }
    // a41 (17/set/2026): com o boot otimista pode haver sessão PENDENTE (sem cache de perfil + SDK lento).
    // Não é "deslogado": espera o SDK responder em vez de mandar ao login quem está logado.
    var _pend = !AUTH.session() && AUTH.sessaoPendente && AUTH.sessaoPendente();
    if (_pend) { _pend.then(window.cbInit); return; }
    if (!AUTH.session()) {
      // a47 (19/set/2026): só vai ao login quem o SDK já disse que não tem sessão E não tem nada guardado. Sessão
      // guardada que o SDK não confirmou: diz isso e dá as saídas; se a sessão chegar, o painel abre sozinho.
      if (typeof AUTH.podeIrAoLogin === "function" && !AUTH.podeIrAoLogin()) {
        el.innerHTML = `<div class="card" role="alert" style="max-width:520px;margin:40px auto;text-align:center;padding:28px">
          <p style="color:var(--text-2);margin-bottom:14px">Não consegui confirmar sua sessão. Pode ser a conexão ou o servidor de login.</p>
          <p><button class="btn primary" onclick="location.reload()"><i class="ti ti-refresh"></i>Tentar de novo</button>
          <a class="btn" href="index.html#entrar"><i class="ti ti-login"></i>Entrar de novo</a></p>
        </div>`;
        if (!window._cbAdmOuvindo && typeof AUTH.aoMudarSessao === "function") {
          window._cbAdmOuvindo = true;
          AUTH.aoMudarSessao(function (s) { if (s) window.cbInit(); });
        }
        return;
      }
      window.location.href = "index.html#entrar"; return;
    }
    // a47: perfil PROVISÓRIO (1º acesso no aparelho, perfil ainda no ar: role "user" por padrão) não decide "não é
    // admin" — espera a carga em curso. Depois dela decide com o que houver; a re-tentativa, se o perfil chegar mais
    // tarde, redesenha por cbPerfilMudou (abaixo). Uma espera só, e quem redesenha é ela: a mesma carga, quando muda o
    // role, também dispara cbPerfilMudou — antes o painel saía duas vezes (10 consultas às métricas em vez de 5).
    var _perf = AUTH.perfilPendente && AUTH.perfilPendente();
    if (_perf) {
      if (!window._cbAdmEsperaPerfil) {
        window._cbAdmEsperaPerfil = true;
        _perf.then(function () { window._cbAdmEsperaPerfil = false; window.cbInit(); });
      }
      return;
    }
    // a47 (céticos, 19/set/2026): a carga terminou SEM ler o perfil (falhou ou estourou o prazo; a re-tentativa vem em
    // 3 s, 10 s e 30 s) e ele segue PROVISÓRIO. "Acesso restrito (role: user)" aqui seria decidir com o padrão, não com
    // o perfil. Diz que está lendo e espera a 1ª leitura boa (AUTH.depoisDoPerfil), uma vez; quem redesenha é ela.
    if (AUTH.perfilProvisorio && AUTH.perfilProvisorio()) {
      el.innerHTML = `<div class="card" role="status" style="max-width:520px;margin:40px auto;text-align:center;padding:28px">
        <p style="color:var(--text-2);margin-bottom:14px">Ainda não consegui ler o seu perfil. Tentando de novo…</p>
        <p><button class="btn primary" onclick="location.reload()"><i class="ti ti-refresh"></i>Tentar de novo</button></p>
      </div>`;
      if (!window._cbAdmEsperaPerfil && typeof AUTH.depoisDoPerfil === "function") {
        window._cbAdmEsperaPerfil = true;
        AUTH.depoisDoPerfil(function () { window._cbAdmEsperaPerfil = false; window.cbInit(); });
      }
      return;
    }
    if (!AUTH.isAdmin()) {
      el.innerHTML = `<div class="card" style="max-width:520px;margin:40px auto;text-align:center;padding:36px">
        <div class="card-icon" style="background:var(--red-light);color:var(--red);margin:0 auto 14px"><i class="ti ti-lock"></i></div>
        <h2 style="font-size:19px;font-weight:600;margin-bottom:6px">Acesso restrito</h2>
        <p style="color:var(--text-2)">Esta área é só para administradores. Sua conta é <strong>${AUTH.session().email}</strong> (role: ${AUTH.session().role}).</p>
        <p style="margin-top:14px"><a class="btn" href="app.html"><i class="ti ti-arrow-left"></i>Voltar ao app</a></p>
      </div>`;
      return;
    }
    document.getElementById("admin-nav").style.display = "flex";
    renderAdmin();
  };
  // a41: se a revalidação do perfil mudar o role (ex.: 1º acesso no aparelho, perfil chegou depois), redesenha.
  // O painel continua protegido no servidor (RLS/RPC); isto é só a tela acompanhando o perfil confirmado.
  // a47: com o cbInit esperando o perfil (_cbAdmEsperaPerfil), quem redesenha é a espera — uma vez só.
  window.cbPerfilMudou = function () { if (window._cbAdmEsperaPerfil) return; if (typeof window.cbInit === "function") window.cbInit(); };
</script>
